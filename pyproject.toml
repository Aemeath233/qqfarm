[project]
name = "qqfarm"
version = "0.6.8"
description = "QQ 农场网页挂机工具，可在本机或服务器运行"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.12,<4",
    "cryptography>=43,<49",
    "fastapi>=0.142.2",
    "python-multipart>=0.0.20,<1",
    "python-dotenv>=1.1,<2",
    "uvicorn[standard]>=0.54.0",
    "wasmtime>=30",
]

[project.scripts]
qqfarm-web = "qqfarm.web_cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "pytest-asyncio>=1",
    "ruff>=0.12",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
